name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        id: pnpm-ci
        run: pnpm install

      - name: Check Format
        id: pnpm-format-check
        run: pnpm run format

      - name: Lint
        id: pnpm-lint
        run: pnpm run lint

      - name: Test
        id: pnpm-test
        run: pnpm run test

      - name: Build
        id: pnpm-build
        run: pnpm run package

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        id: pnpm-ci
        run: pnpm install

      - name: Build
        id: pnpm-build
        run: pnpm run package

      - name: Prepare local action environment
        id: prepare-local-action
        run: |
          cat > .env <<'EOF'
          INPUT_config-path=./example/config.yaml
          INPUT_process="issue, pr, discussion"
          EOF
          printf 'INPUT_github-token="%s"\n' '${{ secrets.GITHUB_TOKEN }}' >> .env

      - name: Test local action
        id: test-local-action
        run: pnpm run local-action
