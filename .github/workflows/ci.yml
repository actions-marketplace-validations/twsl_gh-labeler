name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        id: bun-install
        run: bun install --frozen-lockfile

      - name: Check Format
        id: bun-format-check
        run: bun run format

      - name: Lint
        id: bun-lint
        run: bun run lint

      - name: Test
        id: bun-test
        run: bun run test

      - name: Build
        id: bun-build
        run: bun run package

      - name: Verify committed distribution
        id: verify-dist
        run: git diff --exit-code -- dist/

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        id: bun-install
        run: bun install --frozen-lockfile

      - name: Build
        id: bun-build
        run: bun run package

      - name: Prepare local action environment
        id: prepare-local-action
        run: |
          cat > .env <<'EOF'
          INPUT_config-path=./example/config.yaml
          INPUT_process="issue, pr, discussion"
          EOF
          printf 'INPUT_github-token="%s"\n' '${{ secrets.GITHUB_TOKEN }}' >> .env

      - name: Test local action
        id: test-local-action
        run: bun run local-action
